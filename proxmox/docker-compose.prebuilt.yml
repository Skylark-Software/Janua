#
# Applied by proxmox/janua-install.sh when USE_PREBUILT=yes. The installer
# copies this file to ./docker-compose.override.yml in the install directory,
# and Docker Compose auto-merges it with docker-compose.yml.
#
# Requires Docker Compose v2.24+ for the `!reset null` syntax. If you target
# older versions, remove the `build: !reset null` lines and invoke compose
# with --no-build.

services:
  # Only the guacd (janua) image is published to GHCR today. The guacamole
  # web service still builds locally (fast — a few minutes compared to
  # guacd's FreeRDP 3 compile which dominates the first-run cost).
  guacd:
    image: ghcr.io/skylark-software/janua:${JANUA_IMAGE_TAG:-latest}
    build: !reset null
